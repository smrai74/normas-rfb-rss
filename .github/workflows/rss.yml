name: Gerar RSS – Normas RFB

on:
  schedule:
    # Segunda a sexta às 9h e 15h horário de Brasília (= 12h e 18h UTC)
    - cron: "0 12 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch: # permite rodar manualmente pela aba Actions do GitHub

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gerar-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Gerar feed.xml
        run: python gerar_rss.py

      - name: Mostrar primeiras linhas do feed
        run: head -50 docs/feed.xml

      - name: Commit do feed atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml last_run.txt
          git diff --cached --quiet || git commit -m "chore: atualiza feed RSS [skip ci]"
          git push

  deploy-pages:
    needs: gerar-feed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main   # garante que pega o commit com feed.xml atualizado

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
